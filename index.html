<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section records" id="records-panel">
          <span class="label">RECORDS</span>
          <ol class="records-list" id="records-list"></ol>
          <div class="records-stat"><span class="label">BEST COMBO</span><span id="best-combo">0</span></div>
          <div class="records-stat"><span class="label">MAX LINES</span><span id="max-lines">0</span></div>
          <button id="reset-records-btn" class="small-btn" type="button">Reset records</button>
        </div>

        <div class="panel-section theme-toggle">
          <span class="label">LIGHT MODE</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="overlay-records hidden">
          <form id="record-form" class="record-form hidden">
            <label for="record-name">¡Nuevo récord! Tu nombre:</label>
            <div class="record-form-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" />
              <button id="record-save-btn" type="submit" class="small-btn">Guardar</button>
            </div>
          </form>
          <ol class="records-list" id="overlay-records-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
